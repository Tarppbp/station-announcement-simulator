<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报站模拟器 · 欧陆巡游</title>
<link rel="stylesheet" href="/static/lcd.css?v=4">
<link rel="stylesheet" href="/static/original.css?v=4">
<link rel="stylesheet" href="/static/ets2.css?v=1">
</head>
<body data-mode="tour">
<header class="o-top">
 <div class="o-top-inner">
  <span class="o-brand"><span class="o-brand-icon" aria-hidden="true"></span>报站模拟器</span>
  <nav class="o-tabs" aria-label="页面"><a href="/">原声车厢</a><a href="/tour" aria-current="page">改编工坊</a></nav>
  <div class="o-player" id="player" data-state="idle">
   <span class="o-eq" aria-hidden="true"><i></i><i></i><i></i></span>
   <span class="o-now" id="nowPlaying" aria-live="polite">未在播放</span>
   <button type="button" id="pausePlay" hidden>暂停</button>
   <button type="button" id="resumePlay" hidden>继续</button>
   <button type="button" id="stopPlay" hidden>停止</button>
  </div>
 </div>
</header>

<nav class="t-subnav" aria-label="改编工坊">
 <a href="/tour" aria-current="page">欧陆巡游</a>
 <a href="/edit" id="customLink">自制改编</a>
</nav>

<main class="o-main">
 <aside class="o-lines" aria-labelledby="baseTitle">
  <h2 id="baseTitle">用哪段原声</h2>
  <div class="t-bases" id="baseList"></div>
  <h2 class="t-gap">国家</h2>
  <div class="t-countries" id="countryList"></div>
  <p class="o-note" id="tourNote"></p>
 </aside>

 <section class="o-stage" aria-label="欧陆巡游">
  <div class="o-single-head"><h1 id="tourTitle"></h1><p class="o-note" id="tourSub"></p></div>
  <div id="lcdFrame"></div>
  <div class="o-controls">
   <button type="button" class="o-nav" id="prevCity" title="上一座城市（Alt+←）"><span aria-hidden="true">‹</span> 上一城</button>
   <button type="button" class="o-primary" id="playCity"><i class="o-play" aria-hidden="true"></i><span id="playLabel">播放</span></button>
   <button type="button" class="o-nav" id="nextCity" title="下一座城市（Alt+→）">下一城 <span aria-hidden="true">›</span></button>
  </div>
  <div class="o-controls o-controls-2">
   <button type="button" class="o-ghost" id="autoRun" aria-pressed="false">连续播放本国</button>
   <span class="o-spacer"></span>
   <button type="button" class="o-ghost" id="lcdFull">全屏</button>
   <button type="button" class="o-ghost" id="lcdWindow">单独窗口</button>
  </div>
  <p class="o-status" id="status" role="status"></p>
  <section class="o-stops-card" aria-labelledby="cityTitle">
   <h2 id="cityTitle">城市 <span class="o-count" id="cityCount"></span></h2>
   <ol class="o-stops" id="cityList"></ol>
  </section>
 </section>
</main>
<audio id="audio" hidden></audio>
<div class="o-toast" id="toast" role="status" hidden></div>
<script src="/static/lcd.js?v=4"></script>
<script src="/static/ets2.js?v=1"></script>
</body>
</html>
